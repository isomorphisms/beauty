name: Moving face structural acceptance
on:
  push:
    branches: [main, facial-mask]
  pull_request:
jobs:
  anatomy-and-deformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Anatomy wiring and real deformation
        run: node examples/autogenerated/moving-face/test.mjs
      - name: Standalone demonstration matches canonical source
        run: node examples/autogenerated/moving-face/make-demo.mjs --check
